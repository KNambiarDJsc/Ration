[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ration"
version = "0.2.0"
description = "Spend intelligence where it matters. The inference control plane for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Karthik Nambiar" }]
keywords = ["claude-code", "codex", "coding-agents", "llm", "budget", "scheduler", "autopilot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://github.com/KNambiarDJsc/Ration"
Repository = "https://github.com/KNambiarDJsc/Ration"
Issues = "https://github.com/KNambiarDJsc/Ration/issues"
Changelog = "https://github.com/KNambiarDJsc/Ration/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ration = "ration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ration"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "claude-plugin", ".claude-plugin", "README.md", "CHANGELOG.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: runs real git repositories and processes (slower); part of the default run"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
