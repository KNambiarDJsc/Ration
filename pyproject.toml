[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ration"
version = "0.2.0"
description = "Spend intelligence where it matters. The inference control plane for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Karthik Nambiar" }]
keywords = ["claude-code", "codex", "coding-agents", "llm", "budget", "scheduler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://github.com/KNambiarDJsc/Ration"
Repository = "https://github.com/KNambiarDJsc/Ration"
Issues = "https://github.com/KNambiarDJsc/Ration/issues"
Changelog = "https://github.com/KNambiarDJsc/Ration/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ration = "ration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
